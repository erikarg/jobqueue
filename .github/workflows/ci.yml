name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and test against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobqueue
          POSTGRES_PASSWORD: jobqueue
          POSTGRES_DB: jobqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobqueue -d jobqueue"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      # The Makefile passes DATABASE_URL through as TEST_DATABASE_URL.
      - name: Unit and integration tests
        run: make test-integration
        env:
          DATABASE_URL: postgres://jobqueue:jobqueue@localhost:5432/jobqueue?sslmode=disable
